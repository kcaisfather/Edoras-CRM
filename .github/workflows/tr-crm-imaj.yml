# Türkiye kopyası — CRM imajı (panelin tr-panel-imaj.yml kalıbı; derleme burada, app-1'de DEĞİL — 2 vCPU).
# İmaj GHCR'de ÖZEL; Coolify (app-1) çeker. Derlemede kişisel veri yok: yalnız kod + herkese açık NEXT_PUBLIC
# değerleri (.dockerignore docs/supabase/scripts'i bağlama almaz). Next telemetrisi Dockerfile'da kapalı.
# Sırlar (service role'ler, CRON_SECRET, EDORAS_SUPABASE_*…) BURAYA GİRMEZ — Coolify çalışma ortamında.
#
# Depo değişkenleri (Settings → Secrets and variables → Actions → Variables):
#   TR_NEXT_PUBLIC_SUPABASE_URL          https://tr-crm-api.edorasapp.ai   (CRM yığını)
#   TR_NEXT_PUBLIC_SUPABASE_ANON_KEY     CRM kopyasının anon anahtarı (istemciye gömülür, herkese açık tasarım)
#   TR_NEXT_PUBLIC_EDORAS_PANEL_URL      https://tr-panel.edorasapp.ai
#   TR_NEXT_PUBLIC_APP_URL               https://tr-crm.edorasapp.ai
#   TR_NEXT_PUBLIC_EDORAS_STORAGE_URL    https://tr-api.edorasapp.ai       (kurum logoları: panel yığını; next.config)
name: TR CRM imajı

on:
  push:
    branches: [tr-hosting]
    paths-ignore: ['docs/**', 'supabase/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tr-crm-imaj
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAJ: ghcr.io/kcaisfather/edoras-crm-tr
    steps:
      - name: Depo değişkenleri dolu mu, kopya canlıyı gösteriyor mu
        env:
          URL: ${{ vars.TR_NEXT_PUBLIC_SUPABASE_URL }}
          ANON: ${{ vars.TR_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PANEL: ${{ vars.TR_NEXT_PUBLIC_EDORAS_PANEL_URL }}
          APP: ${{ vars.TR_NEXT_PUBLIC_APP_URL }}
          STORAGE: ${{ vars.TR_NEXT_PUBLIC_EDORAS_STORAGE_URL }}
        run: |
          for v in URL ANON PANEL APP STORAGE; do
            [ -n "${!v}" ] || { echo "::error::depo değişkeni boş: TR_NEXT_PUBLIC_* ($v)"; exit 1; }
          done
          # Kopya CRM ASLA canlı Supabase'e bağlanmaz (ne CRM yığını ne de logo kaynağı).
          for v in URL STORAGE; do
            case "${!v}" in *supabase.co*) echo "::error::$v canlı Supabase'i gösteriyor"; exit 1 ;; esac
          done

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Kanıt ekleri derleme değişkenlerini kaydedebilir; gerek yok.
          provenance: false
          tags: |
            ${{ env.IMAJ }}:${{ github.sha }}
            ${{ env.IMAJ }}:tr-hosting
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.TR_NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.TR_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_EDORAS_PANEL_URL=${{ vars.TR_NEXT_PUBLIC_EDORAS_PANEL_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.TR_NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_EDORAS_STORAGE_URL=${{ vars.TR_NEXT_PUBLIC_EDORAS_STORAGE_URL }}
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
          cache-from: type=gha,scope=tr-crm
          cache-to: type=gha,scope=tr-crm,mode=max
